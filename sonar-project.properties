# SonarQube Cloud 用の設定
sonar.organization=creationline-nfr
sonar.projectKey=creationline_sonarqube-webinar-ide
sonar.projectName=SonarQube Webinar Demo

# 解析対象（本体コードとテストコードを分けて宣言する）
#   ファイルを個別に列挙すると、デモ中にファイルを出し入れしたときに
#   「指定されたファイルが無い」とスキャナーが止まるので "." で指定する
#   テストもファイル名ではなくパターンで指定する（README だけの main でも止まらないように）
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=test_*.py
sonar.exclusions=test_*.py,.github/**

sonar.python.version=3.10,3.11,3.12,3.13
sonar.sourceEncoding=UTF-8

# テストカバレッジ
#   CI 側で下記を実行してから scan する（coverage.xml はコミットしない）
#     coverage run --source=. --omit="test_*.py" -m unittest discover
#     coverage xml
sonar.python.coverage.reportPaths=coverage.xml
